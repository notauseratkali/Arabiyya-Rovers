  </g>

  <!-- Banner (ASG ROVERS) -->
  <g id="banner">
    <path d="M 160 365 L 340 365 L 358 385 L 340 405 L 160 405 L 142 385 Z"
          fill="#000000" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
    <text x="250" y="392" font-family="'Times New Roman', Georgia, serif" font-size="24" font-weight="bold"
