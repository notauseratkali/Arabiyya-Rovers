    <path d="M 188 410 C 185 440 170 458 120 464 C 155 460 185 450 190 410 Z"
          fill="#000000" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
    <!-- Right Bottom Flare -->
    <path d="M 312 410 C 315 440 330 458 380 464 C 345 460 315 450 310 410 Z"
